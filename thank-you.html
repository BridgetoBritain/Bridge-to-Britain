<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank You | Bridge to England</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css?v=548">
<style>
.site-header{position:static!important}
.thank-you-page{
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:70px 20px;
  background:#f8f6f1;
}
.thank-you-card{
  width:min(760px,100%);
  background:#fff;
  border:1px solid rgba(201,154,80,.35);
  border-radius:18px;
  padding:48px 34px;
  text-align:center;
  box-shadow:0 16px 40px rgba(6,29,52,.08);
}
.thank-you-card .eyebrow{
  color:#c99a50;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:12px;
}
.thank-you-card h1{
  color:#071f36;
  margin:0 0 18px;
}
.thank-you-card p{
  max-width:620px;
  margin:0 auto 26px;
  color:#536273;
  line-height:1.7;
}
.thank-you-card a{
  display:inline-block;
  background:#c99a50;
  color:#071f36;
  text-decoration:none;
  font-weight:800;
  padding:14px 24px;
  border-radius:8px;
}
.simple-header{
  background:#071f36;
  padding:24px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.simple-brand{
  text-decoration:none;
  display:flex;
  flex-direction:column;
}
.simple-brand strong{
  color:#fff;
  font-family:Georgia,serif;
  font-size:1.35rem;
  letter-spacing:.04em;
}
.simple-brand span{
  color:#c99a50;
  font-size:.62rem;
  letter-spacing:.16em;
  font-weight:800;
  margin-top:5px;
}
.language-toggle{
  background:transparent;
  border:1px solid rgba(201,154,80,.65);
  color:#fff;
  border-radius:8px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:700;
}
</style>

<style id="thank-you-logo-v571">
.simple-brand img.thank-you-logo{
  display:block;
  width:105px;
  height:auto;
  max-height:92px;
  object-fit:contain;
  background:#fff;
  border-radius:4px;
}
@media(max-width:700px){
  .simple-brand img.thank-you-logo{width:78px;max-height:70px}
}
</style>


<style id="logo-polish-v575">
/* V5.75 - larger Bridge to England logo + cleaner header/hero join */

/* Remove the dark divider/line around the header and hero split */
.site-header {
  border-bottom: 0 !important;
  box-shadow: none !important;
}
.hero,
.hero-grid,
.hero-copy,
.hero-media,
.hero-image,
.hero-image-wrap {
  border: 0 !important;
  border-left: 0 !important;
  border-right: 0 !important;
  outline: 0 !important;
  box-shadow: none !important;
}

/* Larger, better-balanced desktop logo */
.site-header .brand,
.site-header .brand-wordmark {
  flex: 0 0 170px !important;
  width: 170px !important;
  min-width: 170px !important;
  max-width: 170px !important;
}

.site-header .brand img.site-logo-image,
.site-header .brand-wordmark img.site-logo-image {
  display: block !important;
  width: 150px !important;
  height: auto !important;
  max-height: 86px !important;
  object-fit: contain !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: 4px !important;
  box-shadow: none !important;
}

/* Keep the header compact and vertically balanced */
@media (min-width: 981px) {
  .site-header .nav-wrap.container {
    min-height: 108px !important;
  }
}

/* Tablet */
@media (max-width: 980px) {
  .site-header .brand,
  .site-header .brand-wordmark {
    flex: 0 0 105px !important;
    width: 105px !important;
    min-width: 105px !important;
    max-width: 105px !important;
  }

  .site-header .brand img.site-logo-image,
  .site-header .brand-wordmark img.site-logo-image {
    width: 96px !important;
    max-height: 66px !important;
  }
}

/* Small phones */
@media (max-width: 560px) {
  .site-header .brand,
  .site-header .brand-wordmark {
    flex: 0 0 88px !important;
    width: 88px !important;
    min-width: 88px !important;
    max-width: 88px !important;
  }

  .site-header .brand img.site-logo-image,
  .site-header .brand-wordmark img.site-logo-image {
    width: 82px !important;
    max-height: 58px !important;
  }
}
</style>


<style id="logo-seam-fix-v576">
/* V5.76 - slightly larger header logo and force-remove the hero seam */

/* Header logo: larger, but still leaves comfortable room for navigation */
@media (min-width: 1280px) {
  .site-header .brand,
  .site-header .brand-wordmark {
    flex: 0 0 200px !important;
    width: 200px !important;
    min-width: 200px !important;
    max-width: 200px !important;
  }

  .site-header .brand img.site-logo-image,
  .site-header .brand-wordmark img.site-logo-image {
    width: 178px !important;
    height: auto !important;
    max-height: 100px !important;
    object-fit: contain !important;
    margin: 0 !important;
  }

  .site-header .nav-wrap.container {
    min-height: 110px !important;
  }
}

/* Medium desktop: keep enough room for the navigation text */
@media (min-width: 981px) and (max-width: 1279px) {
  .site-header .brand,
  .site-header .brand-wordmark {
    flex: 0 0 170px !important;
    width: 170px !important;
    min-width: 170px !important;
    max-width: 170px !important;
  }

  .site-header .brand img.site-logo-image,
  .site-header .brand-wordmark img.site-logo-image {
    width: 150px !important;
    max-height: 86px !important;
  }
}

/* Remove every possible header line */
.site-header,
.site-header .nav-wrap,
.site-header .container {
  border-bottom: 0 !important;
  box-shadow: none !important;
}
.site-header::before,
.site-header::after,
.site-header .nav-wrap::before,
.site-header .nav-wrap::after {
  content: none !important;
  display: none !important;
}

/* Force the hero panels to meet with no black/sub-pixel seam */
.hero,
.hero-grid,
.hero-copy,
.hero-photo {
  border: 0 !important;
  outline: 0 !important;
  box-shadow: none !important;
}

.hero-grid {
  gap: 0 !important;
  column-gap: 0 !important;
  background: #071b31 !important;
  overflow: hidden !important;
}

.hero-copy {
  position: relative !important;
  z-index: 1 !important;
  margin-right: -1px !important;
}

/* Overlap the image very slightly over the join.
   This removes the thin dark line caused by browser sub-pixel rendering. */
.hero-photo {
  position: relative !important;
  z-index: 2 !important;
  overflow: hidden !important;
  margin-left: -3px !important;
  width: calc(100% + 3px) !important;
}

.hero-photo img {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  border: 0 !important;
  outline: 0 !important;
  margin: 0 !important;
}
</style>


<style id="final-logo-v577">
/* V5.77 - approved Bridge to England logo */
.site-header .brand img.site-logo-image,
.site-header .brand-wordmark img.site-logo-image {
  width: 190px !important;
  max-height: 100px !important;
  height: auto !important;
  object-fit: contain !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
}

@media (min-width: 981px) and (max-width: 1279px) {
  .site-header .brand img.site-logo-image,
  .site-header .brand-wordmark img.site-logo-image {
    width: 165px !important;
    max-height: 90px !important;
  }
}

@media (max-width: 980px) {
  .site-header .brand img.site-logo-image,
  .site-header .brand-wordmark img.site-logo-image {
    width: 110px !important;
    max-height: 70px !important;
  }
}

@media (max-width: 560px) {
  .site-header .brand img.site-logo-image,
  .site-header .brand-wordmark img.site-logo-image {
    width: 92px !important;
    max-height: 62px !important;
  }
}

/* Footer logo uses the same approved image at a comfortable width */
footer .footer-logo-image {
  width: 210px !important;
  height: auto !important;
  max-width: 100% !important;
  object-fit: contain !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
}

/* Keep header and hero joins clean */
.site-header,
.site-header .nav-wrap,
.hero,
.hero-grid,
.hero-copy,
.hero-photo {
  border: 0 !important;
  outline: 0 !important;
  box-shadow: none !important;
}
</style>

</head>
<body>
<header class="simple-header">
<a class="simple-brand" href="index.html"><img src="bridge-to-england-logo.png" alt="Bridge to England logo" class="thank-you-logo"></a>
<button class="language-toggle" type="button">TR</button>
</header>

<main class="thank-you-page">
<section class="thank-you-card">
<div class="eyebrow" data-en="Message Received" data-tr="Mesajınız Alındı">Message Received</div>
<h1 data-en="Thank you for contacting Bridge to England."
    data-tr="Bridge to England ile iletişime geçtiğiniz için teşekkür ederiz.">
Thank you for contacting Bridge to England.
</h1>
<p data-en="Your enquiry has been submitted successfully. We will review your message and get back to you as soon as possible."
   data-tr="Talebiniz başarıyla gönderildi. Mesajınızı inceleyip mümkün olan en kısa sürede sizinle iletişime geçeceğiz.">
Your enquiry has been submitted successfully. We will review your message and get back to you as soon as possible.
</p>
<a href="index.html" data-en="Return to Home" data-tr="Ana Sayfaya Dön">Return to Home</a>
</section>
</main>

<script src="script.js?v=569"></script>
</body>
</html>
