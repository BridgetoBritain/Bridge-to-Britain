<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank You | Bridge to England</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css?v=571">
<style>
.site-header{position:static!important}
.thank-you-page{
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:70px 20px;
  background:#f8f6f1;
}
.thank-you-card{
  width:min(760px,100%);
  background:#fff;
  border:1px solid rgba(201,154,80,.35);
  border-radius:18px;
  padding:48px 34px;
  text-align:center;
  box-shadow:0 16px 40px rgba(6,29,52,.08);
}
.thank-you-card .eyebrow{
  color:#c99a50;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:12px;
}
.thank-you-card h1{
  color:#071f36;
  margin:0 0 18px;
}
.thank-you-card p{
  max-width:620px;
  margin:0 auto 26px;
  color:#536273;
  line-height:1.7;
}
.thank-you-card a{
  display:inline-block;
  background:#c99a50;
  color:#071f36;
  text-decoration:none;
  font-weight:800;
  padding:14px 24px;
  border-radius:8px;
}
.simple-header{
  background:#071f36;
  padding:24px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.simple-brand{
  text-decoration:none;
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:12px;
}
.simple-bridge-logo{
  width:46px;
  height:35px;
  object-fit:contain;
  flex:0 0 auto;
}
.simple-brand-text{
  display:flex;
  flex-direction:column;
}
.simple-brand strong{
  color:#fff;
  font-family:Georgia,serif;
  font-size:1.35rem;
  letter-spacing:.04em;
}
.simple-brand span{
  color:#c99a50;
  font-size:.62rem;
  letter-spacing:.16em;
  font-weight:800;
  margin-top:5px;
}
.language-toggle{
  background:transparent;
  border:1px solid rgba(201,154,80,.65);
  color:#fff;
  border-radius:8px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:700;
}
</style>
</head>
<body>
<header class="simple-header">
<a class="simple-brand" href="index.html">
<img class="simple-bridge-logo" src="bridge-logo-mark.svg" alt="" aria-hidden="true">
<span class="simple-brand-text"><strong>BRIDGE TO ENGLAND</strong>
<span>YOUR TRUSTED UK PARTNER</span></span>
</a>
<button class="language-toggle" type="button">TR</button>
</header>

<main class="thank-you-page">
<section class="thank-you-card">
<div class="eyebrow" data-en="Message Received" data-tr="Mesajınız Alındı">Message Received</div>
<h1 data-en="Thank you for contacting Bridge to England."
    data-tr="Bridge to England ile iletişime geçtiğiniz için teşekkür ederiz.">
Thank you for contacting Bridge to England.
</h1>
<p data-en="Your enquiry has been submitted successfully. We will review your message and get back to you as soon as possible."
   data-tr="Talebiniz başarıyla gönderildi. Mesajınızı inceleyip mümkün olan en kısa sürede sizinle iletişime geçeceğiz.">
Your enquiry has been submitted successfully. We will review your message and get back to you as soon as possible.
</p>
<a href="index.html" data-en="Return to Home" data-tr="Ana Sayfaya Dön">Return to Home</a>
</section>
</main>

<script src="script.js?v=569"></script>
</body>
</html>
